version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: enklave
      POSTGRES_USER: enklave
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enklave"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: "server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -ip=seaweedfs"
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - s3data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  # s3-init:
  #   image: minio/mc
  #   depends_on:
  #     - seaweedfs
  #   entrypoint: >
  #     /bin/sh -c "
  #     sleep 5;
  #     mc alias set local http://seaweedfs:8333 dev_access_key dev_secret_key;
  #     mc mb local/enklave || true;
  #     "
  #   networks:
  #     - aisubiecte-network
volumes:
  pgdata:
  redisdata:
  s3data: